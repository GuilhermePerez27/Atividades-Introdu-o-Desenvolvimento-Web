<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>

    <style>
        body {
        background-color: #000080;
        color: #FFFFFF;
        font-family: monospace;
        margin: 0;
        }

        header, footer {
        text-align: center;
        padding: 20px;
        background-color: #0F0F4D;
        font-size: 30px;
        font-weight: bold;
        }

        footer {
        align-items: flex-end;
        display: flex;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
        margin-bottom: 0;
        }

        label {
        display: block;
        text-align: center;
        }

        textarea {
        display: block;
        margin: 10px auto;
        padding: 5px;
        align-items: center;
        }

        input {
        display: block;
        margin: 10px auto;
        padding: 5px;
        font-size: 16px;
        border: 2px solid #FFFFFF;
        border-radius: 8px;
        width: 300px;
        }

        input:invalid {
            border: 2px solid red;
        }

        input:valid {
            border: 2px solid #5C5CE6;
        }

        input:focus {
            outline: none;
            border-color: #9999FF;
            box-shadow: 0 0 5px #9999FF;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 10px;
            font-size: 18px;
            background-color: #CCCCFF;
            color: #0F0F4D;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(1, 206, 1);
            color: white;
        }



    </style>
</head>
<body>
    
    <header>
        <h1 style="background-color: #000080;">Pesquisa</h1>

    </header>

    <main>
        <form>
        <fieldset>
            <legend>Formulário de Dados</legend>
            <fieldset>
                <legend>Informações Pessoais</legend>
                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome"><br>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email"><br>
                <label for="senha">Senha:</label><br>
                <input type="password" id="senha" name="senha"><br>
                <label for="data">Data de Nascimento:</label><br>
                <input type="date" id="data" name="data"><br>
            </fieldset>
            <fieldset>
                <legend>Sexo</legend>
                <input type="radio" id="masculino" name="genero" value="masculino">
                <label for="masculino">Masculino</label><br>
                <input type="radio" id="feminino" name="genero" value="feminino">
                <label for="feminino">Feminino</label><br>
            </fieldset>
            <fieldset>
                <legend>Interesses</legend>
                <label for="interesses">Selecione seus interesses:</label><br>
                <input type="checkbox" id="HTML" name="interesses" value="HTML">
                <label for="HTML">HTML</label><br>  
                <input type="checkbox" id="CSS" name="interesses" value="CSS">
                <label for="CSS">CSS</label><br>
                <input type="checkbox" id="JavaScript" name="interesses" value="JavaScript">
                <label for="JavaScript">JavaScript</label><br>
                <input type="checkbox" id="Python" name="interesses" value="Python">
                <label for="Python">Python</label><br>
                <input type="checkbox" id="Java" name="interesses" value="Java">
                <label for="Java">Java</label><br>
            </fieldset>
            <fieldset>
                <legend>Comentários</legend>
                <label for="comentarios">Deixe seus comentários:</label><br>
                <textarea id="comentarios" name="comentarios" rows="4" cols="50"></textarea><br>
            </fieldset>
            <fieldset>
                <legend>Upload de Foto</legend>
                <input type="file" id="foto" name="foto" accept="image/*"><br>
            </fieldset>
        </fieldset>
        <fieldset>
            <legend>Enviar</legend>
            <button type="submit">Enviar</button>
        </form>

    </main> 

    <footer>
        Introdução a Desenvolvimento Web - 2026
    </footer>

</body>
</html>
